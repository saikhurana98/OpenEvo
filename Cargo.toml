[package]
name = "openevo"
version = "0.3.1"
edition = "2024"
description = "OpenEvo: an independent native Audient EVO 4 control surface for Windows"
repository = "https://github.com/saikhurana98/OpenEvo"
readme = "README.md"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
slint-build = "=1.18.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
