name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - name: Test
        shell: pwsh
        run: ./tools/build.ps1 -Configuration release -Test
      - name: Package
        shell: pwsh
        run: |
          $version = ((Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value)
          ./tools/package.ps1 -Version $version
      - name: Offscreen motion checks
        shell: pwsh
        run: ./tools/test-motion.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenEvo-windows-x64
          path: dist/OpenEvo-*-windows-x64.zip
          if-no-files-found: error
